name: CI

on:
  push:
    branches:
      - main
      - integration
      - feature/dev
  pull_request:
    branches:
      - main
      - integration
      - feature/dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        env:
          PYTHONPATH: .
        run: uv run pytest -n auto --dist loadscope tests
